# eval/golden_dataset.conf
#
# Defines the golden dataset the eval harness scores against.
# `query` returns the labeled ground-truth event set; every event must
# carry a `status_label` field of either `true_positive` or `false_positive`.
#
# Bundle 2 will inject synthetic TP events into the eval run for attack
# injection testing. The golden query is passed as a parameter to
# evaluate_detection() — not hardcoded — so attack injection can supply
# an alternate query (e.g. UNION the seeded set with injected attacks)
# without changing eval_lib.

[default]
query = search index=notable sourcetype=squelch_notable host=squelch-seed
earliest = -90d
latest = now

# BOTSv3 validation (external dataset — Splunk Boss of the SOC v3).
# Ground truth is DERIVED, not shipped: BOTSv3 has a CTF answer key keyed
# to questions, not a per-event TP/FP column. We label every candidate
# stream:dns event true_positive iff its query matches a published malicious
# IOC (the Taedonggang coinhive cryptominer C2; see
# lookups/botsv3_attack_iocs.csv), else false_positive. Labeling is
# decoupled from the detection's behavioral criteria (long DNS labels) so
# false positives arise from benign infrastructure DNS that merely trips the
# heuristic — exactly the noise Squelch is built to tune.
#
# earliest=0 because BOTSv3 events are from August 2018 (a -90d window from
# today reaches no data).
#
# The golden query is scoped to the detection's CANDIDATE POOL (DNS events
# with a long query label OR a coinhive hit), not every DNS packet in the
# index. This is deliberate and correct: the confusion matrix only needs a
# label for events the detection can fire on (precision counts fired
# negatives; recall needs the full TP set, all of which are coinhive and all
# of which fall in this pool). Scoping here keeps the golden result set
# ~10k — comfortably under Splunk oneshot's 50k maxresultrows ceiling, which
# silently truncated an unscoped `sourcetype=stream:dns` pull of 194k events.
[botsv3]
query = search index=botsv3 sourcetype=stream:dns query=* | eval qlen=len(query) | where qlen>40 OR like(query,"%coinhive%") | eval status_label=if(like(query,"%coinhive%"),"true_positive","false_positive")
earliest = 0
latest = now
