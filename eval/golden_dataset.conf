# eval/golden_dataset.conf
#
# Defines the golden dataset the eval harness scores against.
# `query` returns the labeled ground-truth event set; every event must
# carry a `status_label` field of either `true_positive` or `false_positive`.
#
# Bundle 2 will inject synthetic TP events into the eval run for attack
# injection testing. The golden query is passed as a parameter to
# evaluate_detection() — not hardcoded — so attack injection can supply
# an alternate query (e.g. UNION the seeded set with injected attacks)
# without changing eval_lib.

[default]
query = search index=notable sourcetype=squelch_notable host=squelch-seed
earliest = -90d
latest = now
